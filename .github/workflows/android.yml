name: Android

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload ShortBlock APK
        uses: actions/upload-artifact@v4
        with:
          name: shortblock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wissenshappen APK
        uses: actions/upload-artifact@v4
        with:
          name: wissenshappen-debug-apk
          path: wissen/build/outputs/apk/debug/wissen-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            wissen/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
